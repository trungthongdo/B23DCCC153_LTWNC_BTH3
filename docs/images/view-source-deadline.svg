  <!-- HTML Source Code with Syntax Highlighting -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" xml:space="preserve">
    <text x="58" y="98"><tspan fill="#89dceb">&lt;!DOCTYPE</tspan> <tspan fill="#fab387">html</tspan><tspan fill="#89dceb">&gt;</tspan></text>
    <text x="58" y="118"><tspan fill="#89dceb">&lt;html</tspan> <tspan fill="#f9e2af">lang</tspan>=<tspan fill="#a6e3a1">"vi"</tspan><tspan fill="#89dceb">&gt;</tspan></text>
    <text x="58" y="138"><tspan fill="#89dceb">&lt;head&gt;</tspan></text>
    
    <text x="74" y="158"><tspan fill="#89dceb">&lt;title&gt;</tspan><tspan fill="#f5c2e7">Báo cáo BTTH 2: Next.js CSR vs SSR | Lập trình Web Nâng cao</tspan><tspan fill="#89dceb">&lt;/title&gt;</tspan></text>
    <text x="74" y="178"><tspan fill="#89dceb">&lt;meta</tspan> <tspan fill="#f9e2af">name</tspan>=<tspan fill="#a6e3a1">"description"</tspan> <tspan fill="#f9e2af">content</tspan>=<tspan fill="#a6e3a1">"Hạn chót: 21/10/2026. Nộp PDF báo cáo so sánh TTFB, FCP..."</tspan><tspan fill="#89dceb">/&gt;</tspan></text>
    
    <!-- OpenGraph Tags -->
    <text x="74" y="208" fill="#6c7086">&lt;!-- OpenGraph Metadata sinh tự động bởi Server --&gt;</text>
    <text x="74" y="228"><tspan fill="#89dceb">&lt;meta</tspan> <tspan fill="#f9e2af">property</tspan>=<tspan fill="#a6e3a1">"og:title"</tspan> <tspan fill="#f9e2af">content</tspan>=<tspan fill="#a6e3a1">"Báo cáo BTTH 2: Next.js CSR vs SSR - PTIT"</tspan><tspan fill="#89dceb">/&gt;</tspan></text>
    <text x="74" y="248"><tspan fill="#89dceb">&lt;meta</tspan> <tspan fill="#f9e2af">property</tspan>=<tspan fill="#a6e3a1">"og:image"</tspan> <tspan fill="#f9e2af">content</tspan>=<tspan fill="#89b4fa">"http://localhost:3000/deadlines/1/opengraph-image"</tspan><tspan fill="#89dceb">/&gt;</tspan></text>
    <text x="74" y="268"><tspan fill="#89dceb">&lt;meta</tspan> <tspan fill="#f9e2af">property</tspan>=<tspan fill="#a6e3a1">"og:image:width"</tspan> <tspan fill="#f9e2af">content</tspan>=<tspan fill="#a6e3a1">"1200"</tspan><tspan fill="#89dceb">/&gt;</tspan></text>
    <text x="74" y="288"><tspan fill="#89dceb">&lt;meta</tspan> <tspan fill="#f9e2af">property</tspan>=<tspan fill="#a6e3a1">"og:image:height"</tspan> <tspan fill="#f9e2af">content</tspan>=<tspan fill="#a6e3a1">"630"</tspan><tspan fill="#89dceb">/&gt;</tspan></text>

    <!-- Structured Data JSON-LD -->
    <text x="74" y="318" fill="#6c7086">&lt;!-- Structured Data JSON-LD BreadcrumbList chuẩn Schema.org --&gt;</text>
    <text x="74" y="338"><tspan fill="#89dceb">&lt;script</tspan> <tspan fill="#f9e2af">type</tspan>=<tspan fill="#a6e3a1">"application/ld+json"</tspan><tspan fill="#89dceb">&gt;</tspan></text>
    <text x="90" y="358" fill="#fab387">{</text>
    <text x="106" y="378"><tspan fill="#89dceb">"@context"</tspan>: <tspan fill="#a6e3a1">"https://schema.org"</tspan>,</text>
    <text x="106" y="398"><tspan fill="#89dceb">"@type"</tspan>: <tspan fill="#a6e3a1">"BreadcrumbList"</tspan>,</text>
    <text x="106" y="418"><tspan fill="#89dceb">"itemListElement"</tspan>: [</text>
    <text x="122" y="438">{ <tspan fill="#89dceb">"@type"</tspan>: <tspan fill="#a6e3a1">"ListItem"</tspan>, <tspan fill="#89dceb">"position"</tspan>: <tspan fill="#fab387">1</tspan>, <tspan fill="#89dceb">"name"</tspan>: <tspan fill="#a6e3a1">"Trang chủ"</tspan>, <tspan fill="#89dceb">"item"</tspan>: <tspan fill="#89b4fa">"https://class-deadline-hub.ptit.edu.vn/"</tspan> },</text>
    <text x="122" y="458">{ <tspan fill="#89dceb">"@type"</tspan>: <tspan fill="#a6e3a1">"ListItem"</tspan>, <tspan fill="#89dceb">"position"</tspan>: <tspan fill="#fab387">2</tspan>, <tspan fill="#89dceb">"name"</tspan>: <tspan fill="#a6e3a1">"Deadlines"</tspan>, <tspan fill="#89dceb">"item"</tspan>: <tspan fill="#89b4fa">"https://class-deadline-hub.ptit.edu.vn/deadlines"</tspan> },</text>
    <text x="122" y="478">{ <tspan fill="#89dceb">"@type"</tspan>: <tspan fill="#a6e3a1">"ListItem"</tspan>, <tspan fill="#89dceb">"position"</tspan>: <tspan fill="#fab387">3</tspan>, <tspan fill="#89dceb">"name"</tspan>: <tspan fill="#a6e3a1">"Báo cáo BTTH 2: Next.js CSR vs SSR"</tspan> }</text>
    <text x="106" y="498">]</text>
    <text x="90" y="518" fill="#fab387">}</text>
    <text x="74" y="538"><tspan fill="#89dceb">&lt;/script&gt;</tspan></text>
    
    <text x="58" y="558"><tspan fill="#89dceb">&lt;/head&gt;</tspan></text>
    <text x="58" y="578"><tspan fill="#89dceb">&lt;body&gt;</tspan></text>
    <text x="74" y="598"><tspan fill="#89dceb">&lt;h1&gt;</tspan><tspan fill="#f5c2e7">Báo cáo BTTH 2: Next.js CSR vs SSR</tspan><tspan fill="#89dceb">&lt;/h1&gt;</tspan></text>
    <text x="74" y="618"><tspan fill="#89dceb">&lt;p&gt;</tspan><tspan fill="#cdd6f4">Nộp file PDF báo cáo so sánh chi tiết hiệu năng TTFB, FCP...</tspan><tspan fill="#89dceb">&lt;/p&gt;</tspan></text>
    <text x="58" y="638"><tspan fill="#89dceb">&lt;/body&gt;</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Card Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">
      Google Lighthouse 13.5.0 Audit Report
    </text>
    <text x="0" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Production Environment: http://localhost:3000 (Class Deadline Hub PTIT)
    </text>
  </g>

  <!-- Gauge 1: Performance (95) -->
  <g transform="translate(110, 140)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0cce6b" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="13.8" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#0cce6b" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">95</text>
    <text x="0" y="64" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Performance</text>
  </g>

  <!-- Gauge 2: Accessibility (100) -->
  <g transform="translate(310, 140)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0cce6b" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#0cce6b" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="64" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Accessibility</text>
  </g>

  <!-- Gauge 3: Best Practices (96) -->
  <g transform="translate(510, 140)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0cce6b" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="11.0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#0cce6b" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">96</text>
    <text x="0" y="64" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Best Practices</text>
  </g>

  <!-- Gauge 4: SEO (100) -->
  <g transform="translate(710, 140)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#e2e8f0" stroke-width="7"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#0cce6b" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#0cce6b" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle">100</text>
    <text x="0" y="64" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">SEO</text>
  </g>
</svg>
